name: Release Notes

changelog:
  exclude:
    labels:
      - bot-commit
      - ignore-for-release
  categories:
    - title: "✨ Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - fix
        - bug
    - title: "👷 CI/CD"
      labels:
        - ci
        - actions
    - title: "📦 Dependencies"
      labels:
        - dependencies
    - title: "📝 Documentation"
      labels:
        - documentation
    - title: "Other Changes"
      labels:
        - "*"
