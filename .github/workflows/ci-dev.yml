name: CI Dev

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  TURBO_CACHE_DIR: .turbo

jobs:
  setup:
    needs: []
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Turbo Cache
        uses: https://github.com/actions/cache@v3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: https://github.com/jdx/mise-action@v2
        with:
          install: false
      - name: Install dependencies (Anonymous)
        run: |
          unset GITHUB_TOKEN
          unset GH_TOKEN
          unset GITHUB_API_TOKEN
          mise install
      - run: bun install
      - name: Run Verifications
        run: bunx turbo run lint typecheck test

  build-docker:
    needs: [setup]
    runs-on: docker
    strategy:
      matrix:
        app: [admin-panel, consumer-app, scraper-service]
    steps:
      - uses: https://github.com/actions/checkout@v4
      
      - name: Install Docker CLI
        run: |
          apt-get update && apt-get install -y curl iproute2 jq
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz \
            | tar xz --strip-components=1 -C /usr/local/bin docker/docker

      - name: Configure Docker Host
        run: |
          # Job containers run inside DinD — reach the daemon via gateway IP
          GATEWAY=$(ip route | grep default | awk '{print $3}')
          echo "DOCKER_HOST=tcp://${GATEWAY}:2375" >> $GITHUB_ENV

      - name: Login to Registry
        run: echo "${{ secrets.CI_TOKEN }}" | docker login git.yomite.in -u ${{ github.actor }} --password-stdin

      - name: Generate env file
        run: |
          echo '${{ toJSON(vars) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env.production

      - name: Build and Push
        run: |
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          TAG_BASE="git.yomite.in/${REPO}/${{ matrix.app }}"
          docker build -f apps/${{ matrix.app }}/Dockerfile \
            -t "${TAG_BASE}:dev-latest" \
            -t "${TAG_BASE}:dev-${{ github.sha }}" \
            -t "${TAG_BASE}:dev-build-${{ github.run_number }}" \
            .
          docker push "${TAG_BASE}:dev-latest"
          docker push "${TAG_BASE}:dev-${{ github.sha }}"
          docker push "${TAG_BASE}:dev-build-${{ github.run_number }}"

  build-extension:
    needs: [setup]
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/jdx/mise-action@v2
        with:
          install: false
      - name: Install dependencies (Anonymous)
        run: |
          unset GITHUB_TOKEN
          unset GH_TOKEN
          unset GITHUB_API_TOKEN
          mise install
      - run: bun install
      - name: Build Extension
        working-directory: apps/browser-extension
        run: bun run build
      
      - name: Install Zip
        run: apt-get update && apt-get install -y zip

      - name: Zip Extension
        working-directory: apps/browser-extension/dist
        run: zip -r extension-dev-${{ github.sha }}.zip .
      - name: Upload Extension Artifact
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: browser-extension-dev-${{ github.sha }}
          path: apps/browser-extension/dist/extension-dev-${{ github.sha }}.zip
          retention-days: 5

  deploy:
    runs-on: docker
    needs: [build-docker, build-extension]
    steps:
      - name: Deploy to Staging
        run: echo "Deploying to Staging... Success"

  promote:
    runs-on: docker
    needs: [deploy]
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          token: ${{ secrets.CI_TOKEN }}
          fetch-depth: 0
      
      - name: Merge dev to main
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci-bot@yomite.in"
          git checkout main
          git merge origin/dev
          git push origin main
