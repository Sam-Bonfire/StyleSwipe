name: CI Dev

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  TURBO_CACHE_DIR: .turbo

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: jdx/mise-action@v2
      - run: bun install
      - name: Run Verifications
        run: bunx turbo run lint typecheck test

  build-docker:
    needs: [setup]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [scraper-service]
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate env file
        run: |
          echo '${{ toJSON(vars) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env.production

      - name: Build and Push
        run: |
          TAG_BASE="ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}"
          docker build -f apps/${{ matrix.app }}/Dockerfile \
            -t "${TAG_BASE}:dev-latest" \
            -t "${TAG_BASE}:dev-${{ github.sha }}" \
            -t "${TAG_BASE}:dev-build-${{ github.run_number }}" \
            .
          docker push "${TAG_BASE}:dev-latest"
          docker push "${TAG_BASE}:dev-${{ github.sha }}"
          docker push "${TAG_BASE}:dev-build-${{ github.run_number }}"

  build-extension:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install
      - name: Build Extension
        working-directory: apps/browser-extension
        run: bun run build

      - name: Zip Extension
        working-directory: apps/browser-extension/dist
        run: zip -r extension-dev-${{ github.sha }}.zip .
      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension-dev-${{ github.sha }}
          path: apps/browser-extension/dist/extension-dev-${{ github.sha }}.zip
          retention-days: 5

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-docker, build-extension]
    steps:
      - uses: actions/checkout@v4
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: jdx/mise-action@v2
      - run: bun install

      - name: Build SPAs
        run: bunx turbo run build --filter @app/admin-panel --filter @app/consumer-app

      - name: Deploy Admin Panel to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: styleswipe-admin-panel
          directory: apps/admin-panel/dist
          branch: staging

      - name: Deploy Consumer App to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: styleswipe-consumer-app
          directory: apps/consumer-app/dist
          branch: staging

      - name: Deploy Convex (Preview)
        run: bunx convex deploy --preview
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  promote:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Merge dev to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge origin/dev
          git push origin main
