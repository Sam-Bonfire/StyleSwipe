name: Staging Deployment

on:
  push:
    branches: ["dev"]

permissions:
  contents: write
  packages: write

env:
  TURBO_CACHE_DIR: .turbo
  MISE_TRUSTED_CONFIG_PATHS: '/'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Turbo Cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise trust
      - run: mise run init
      - name: Run Verifications
        run: |
          mise run lint
          mise run typecheck
          mise run test

  build-docker:
    needs: [setup]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [scraper-service]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise trust

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate env file
        run: mise run env:generate '${{ toJSON(vars) }}' .env.staging

      - name: Build and Push
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG_BASE="ghcr.io/${OWNER_LOWER}/${{ matrix.app }}"
          TAGS="${TAG_BASE}:staging-latest ${TAG_BASE}:staging-${{ github.sha }} ${TAG_BASE}:staging-build-${{ github.run_number }}"
          mise run docker:build "${{ matrix.app }}" $TAGS
          mise run docker:push $TAGS

  build-extension:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise trust
      - run: mise run init

      - name: Build Extension
        run: mise run build:extension

      - name: Zip Extension
        run: mise run pack:extension "extension-staging-${{ github.sha }}.zip"

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension-staging-${{ github.sha }}
          path: apps/browser-extension/dist/extension-staging-${{ github.sha }}.zip
          retention-days: 5

  build-spas:
    needs: [setup]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - name: Turbo Cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise trust
      - run: mise run init

      - name: Generate env file
        run: mise run env:generate '${{ toJSON(vars) }}' .env.local

      - name: Build SPAs
        run: mise run build:spas
        env:
          APP_ENV: staging

      - name: Upload Admin Panel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-staging-${{ github.sha }}
          path: apps/admin-panel/dist
          retention-days: 5

      - name: Upload Consumer App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-app-staging-${{ github.sha }}
          path: apps/consumer-app/dist
          retention-days: 5

  build-android:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v6
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise trust

      - name: Prune Unused Workspaces
        run: mise run prune:unused-workspaces

      - name: Turbo Cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: mise run init

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract App Version
        id: version
        run: mise run app:extract-version

      - name: Expo Prebuild
        run: mise run mobile:prebuild android

      - name: Pin Gradle 8 for Android build
        run: mise run mobile:pin-gradle

      - name: Build Android APK
        run: mise run android:build:apk

      - name: Distribute Android via Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: testers
          file: apps/consumer-app/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-app-android-preview-${{ github.sha }}
          path: apps/consumer-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 5

  build-ios:
    needs: [setup]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Turbo Cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise trust
      - run: mise run init

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Extract App Version
        id: version
        run: mise run app:extract-version

      - name: Expo Prebuild
        run: mise run mobile:prebuild ios

      - name: Install Pods
        run: mise run ios:pod-install

      - name: Build iOS IPA
        run: mise run ios:build

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-app-ios-preview-${{ github.sha }}
          path: apps/consumer-app/ios/build/
          retention-days: 5

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-docker, build-extension, build-spas, build-android, build-ios]
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - name: Turbo Cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise trust
      - run: mise run init

      - name: Download Admin Panel Artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-panel-staging-${{ github.sha }}
          path: apps/admin-panel/dist

      - name: Download Consumer App Artifact
        uses: actions/download-artifact@v4
        with:
          name: consumer-app-staging-${{ github.sha }}
          path: apps/consumer-app/dist

      - name: Deploy Admin Panel to Cloudflare Pages
        run: mise run deploy:cloudflare apps/admin-panel/dist styleswipe-admin-panel staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Consumer App to Cloudflare Pages
        run: mise run deploy:cloudflare apps/consumer-app/dist styleswipe-consumer-app staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Convex (Preview)
        run: mise run convex:deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  promote:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise trust

      - name: Merge dev to main
        run: mise run git:promote-dev
