name: Staging Deployment

on:
  push:
    branches: ["dev"]

permissions:
  contents: write
  packages: write
# Required CI Secrets for Native Builds:
# - ANDROID_KEYSTORE_BASE64: Base64 encoded release keystore
# - ANDROID_KEYSTORE_PASSWORD: Password for the keystore
# - ANDROID_KEY_ALIAS: Alias for the key
# - ANDROID_KEY_PASSWORD: Password for the key
# - IOS_CERTIFICATE_BASE64: Base64 encoded p12 certificate
# - IOS_CERTIFICATE_PASSWORD: Password for the p12 certificate
# - IOS_PROVISIONING_PROFILE_BASE64: Base64 encoded mobileprovision file


env:
  TURBO_CACHE_DIR: .turbo
  MISE_TRUSTED_CONFIG_PATHS: '/'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: mise trust
      - run: bun install
      - name: Run Verifications
        run: bunx turbo run lint typecheck test

  build-docker:
    needs: [setup]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [scraper-service]
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate env file
        run: |
          echo '${{ toJSON(vars) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env.staging

      - name: Build and Push
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG_BASE="ghcr.io/${OWNER_LOWER}/${{ matrix.app }}"
          docker build -f apps/${{ matrix.app }}/Dockerfile \
            -t "${TAG_BASE}:staging-latest" \
            -t "${TAG_BASE}:staging-${{ github.sha }}" \
            -t "${TAG_BASE}:staging-build-${{ github.run_number }}" \
            .
          docker push "${TAG_BASE}:staging-latest"
          docker push "${TAG_BASE}:staging-${{ github.sha }}"
          docker push "${TAG_BASE}:staging-build-${{ github.run_number }}"

  build-extension:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: mise trust
      - run: bun install
      - name: Build Extension
        working-directory: apps/browser-extension
        run: bun run build

      - name: Zip Extension
        working-directory: apps/browser-extension/dist
        run: zip -r extension-staging-${{ github.sha }}.zip .
      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension-staging-${{ github.sha }}
          path: apps/browser-extension/dist/extension-staging-${{ github.sha }}.zip
          retention-days: 5

  build-spas:
    needs: [setup]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: mise trust
      - run: bun install

      - name: Generate env file
        run: |
          echo '${{ toJSON(vars) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env.staging

      - name: Build SPAs
        run: bun run --env-file=.env --env-file=.env.staging bunx turbo run build --filter @app/admin-panel --filter @app/consumer-app
        env:
          APP_ENV: staging

      - name: Upload Admin Panel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-staging-${{ github.sha }}
          path: apps/admin-panel/dist
          retention-days: 5

      - name: Upload Consumer App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-app-staging-${{ github.sha }}
          path: apps/consumer-app/dist
          retention-days: 5

  build-android:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: mise trust
      - run: bun install
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Extract App Version
        id: version
        run: echo "APP_VERSION=$(jq -r .version apps/consumer-app/package.json)" >> $GITHUB_ENV
      - name: Expo Prebuild
        working-directory: apps/consumer-app
        run: bunx expo prebuild --platform android --clean
      # Placeholder: Inject Keystore and properties here
      # - name: Setup Android Keystore
      #   run: |
      #     echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > apps/consumer-app/android/app/release.keystore
      #     echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> apps/consumer-app/android/gradle.properties
      #     echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> apps/consumer-app/android/gradle.properties
      #     echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> apps/consumer-app/android/gradle.properties
      #     echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> apps/consumer-app/android/gradle.properties
      - name: Build Android APK
        working-directory: apps/consumer-app/android
        run: ./gradlew assembleRelease
      - name: Distribute Android via Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: testers
          file: apps/consumer-app/android/app/build/outputs/apk/release/app-release.apk
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-app-android-preview-${{ github.sha }}
          path: apps/consumer-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 5

  build-ios:
    needs: [setup]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: mise trust
      - run: bun install
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Extract App Version
        id: version
        run: echo "APP_VERSION=$(jq -r .version apps/consumer-app/package.json)" >> $GITHUB_ENV
      - name: Expo Prebuild
        working-directory: apps/consumer-app
        run: bunx expo prebuild --platform ios --clean
      - name: Install Pods
        working-directory: apps/consumer-app/ios
        run: pod install
      # Placeholder: Inject Certificates and Provisioning Profiles here
      # - name: Setup Provisioning
      #   run: |
      #     # Install cert and profile logic here
      - name: Build iOS IPA
        working-directory: apps/consumer-app/ios
        run: |
          xcodebuild archive \
            -workspace StyleSwipe.xcworkspace \
            -scheme StyleSwipe \
            -configuration Release \
            -archivePath $PWD/build/StyleSwipe.xcarchive \
            CODE_SIGNING_ALLOWED=NO
          # CODE_SIGNING_ALLOWED=NO is set for demonstration purposes, to allow unsigned builds to pass. In reality, you'd setup provisioning and export the IPA.
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-app-ios-preview-${{ github.sha }}
          path: apps/consumer-app/ios/build/
          retention-days: 5

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-docker, build-extension, build-spas, build-android, build-ios]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: mise trust
      - run: bun install

      - name: Download Admin Panel Artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-panel-staging-${{ github.sha }}
          path: apps/admin-panel/dist

      - name: Download Consumer App Artifact
        uses: actions/download-artifact@v4
        with:
          name: consumer-app-staging-${{ github.sha }}
          path: apps/consumer-app/dist

      - name: Deploy Admin Panel to Cloudflare Pages
        run: bunx wrangler pages deploy apps/admin-panel/dist --project-name=styleswipe-admin-panel --branch=staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Consumer App to Cloudflare Pages
        run: bunx wrangler pages deploy apps/consumer-app/dist --project-name=styleswipe-consumer-app --branch=staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Convex (Preview)
        run: bunx convex deploy
        working-directory: packages/convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  promote:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Merge dev to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --ff-only origin/dev
          git push origin main
