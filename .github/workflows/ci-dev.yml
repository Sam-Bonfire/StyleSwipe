name: CI Dev

on:
  push:
    branches: ["dev"]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: bun install
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: bun install
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: bun install
      - run: bun run test

  build-docker:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin-panel, consumer-app, scraper-service]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Git Config
        uses: docker/login-action@v3
        with:
          registry: git.yomite.in
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: git.yomite.in/${{ github.repository }}/${{ matrix.app }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-extension:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: bun install
      - name: Build Extension
        working-directory: apps/browser-extension
        run: bun run build
      - name: Zip Extension
        working-directory: apps/browser-extension/dist
        run: zip -r extension-${{ github.sha }}.zip .
      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension-dev
          path: apps/browser-extension/dist/extension-${{ github.sha }}.zip
          retention-days: 5
