name: Mobile CI/CD Pipeline

on:
  push:
    tags:
      - 'v*' # Trigger on version tags
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (preview, production)'
        required: true
        default: 'preview'
      platform:
        description: 'Platform (android, ios, all)'
        required: true
        default: 'all'

jobs:
  build-and-distribute:
    name: Build & Distribute (${{ inputs.platform || 'all' }})
    # Use macOS to allow iOS builds on the local runner
    runs-on: macos-latest
    
    defaults:
      run:
        working-directory: apps/consumer-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Monorepo Dependencies
        run: bun install
        working-directory: .

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # -----------------------------------------------------------------
      # ANDROID PIPELINE
      # -----------------------------------------------------------------
      - name: Build Android APK (Local)
        if: ${{ github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all' || github.event_name == 'push' }}
        run: eas build --platform android --local --non-interactive --profile ${{ github.event.inputs.environment || 'preview' }}
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Distribute Android via Firebase App Distribution
        if: ${{ github.event.inputs.environment == 'preview' || github.event_name != 'push' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: testers
          file: apps/consumer-app/build/*.apk

      - name: Submit Android to Google Play (Production)
        if: ${{ github.event.inputs.environment == 'production' || github.event_name == 'push' }}
        run: eas submit --platform android --non-interactive --profile production

      # -----------------------------------------------------------------
      # IOS PIPELINE
      # -----------------------------------------------------------------
      - name: Build iOS IPA (Local)
        if: ${{ github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all' || github.event_name == 'push' }}
        run: eas build --platform ios --local --non-interactive --profile ${{ github.event.inputs.environment || 'preview' }}
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Distribute iOS via Firebase App Distribution
        if: ${{ github.event.inputs.environment == 'preview' || github.event_name != 'push' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_IOS }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: testers
          file: apps/consumer-app/build/*.ipa

      - name: Submit iOS to TestFlight / App Store (Production)
        if: ${{ github.event.inputs.environment == 'production' || github.event_name == 'push' }}
        run: eas submit --platform ios --non-interactive --profile production
