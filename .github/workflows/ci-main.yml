name: Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag version to release'
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  TURBO_CACHE_DIR: .turbo
  MISE_TRUSTED_CONFIG_PATHS: '/'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.get_version.outputs.version }}
      owner_lower: ${{ steps.get_version.outputs.owner_lower }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise trust
      - name: Extract version
        id: get_version
        run: mise run release:extract-info "${{ inputs.tag_name || github.ref_name }}" "${{ github.repository_owner }}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          body: |
            ### 🐳 Docker Container
            ```bash
            docker pull ghcr.io/${{ steps.get_version.outputs.owner_lower }}/scraper-service:${{ steps.get_version.outputs.version }}
            ```

            ### 📝 Changelog
            ${{ steps.get_version.outputs.changelog }}
          generate_release_notes: true
          draft: false
          prerelease: false

  build-push-docker:
    needs: [create-release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [scraper-service]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise trust

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate env file
        run: mise run env:generate '${{ toJSON(vars) }}' .env.production

      - name: Build and Push
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG_BASE="ghcr.io/${OWNER_LOWER}/${{ matrix.app }}"
          VERSION=${{ needs.create-release.outputs.new_version }}
          TAGS="${TAG_BASE}:latest ${TAG_BASE}:${VERSION}"
          mise run docker:build "${{ matrix.app }}" $TAGS
          mise run docker:push $TAGS

  build-publish-extension:
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise trust
      - run: mise run init

      - name: Build Extension
        run: mise run build:extension

      - name: Zip Extension
        run: |
          VERSION=${{ needs.create-release.outputs.new_version }}
          mise run pack:extension "extension-v${VERSION}.zip"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: apps/browser-extension/dist/extension-*.zip

  build-spas:
    needs: [create-release]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Turbo Cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise trust
      - run: mise run init

      - name: Generate env file
        run: mise run env:generate '${{ toJSON(vars) }}' .env.local

      - name: Build SPAs
        run: mise run build:spas
        env:
          APP_ENV: production

      - name: Upload Admin Panel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-prod-v${{ needs.create-release.outputs.new_version }}
          path: apps/admin-panel/dist
          retention-days: 5

      - name: Upload Consumer App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-app-prod-v${{ needs.create-release.outputs.new_version }}
          path: apps/consumer-app/dist
          retention-days: 5

  build-android:
    needs: [create-release]
    if: needs.create-release.outputs.new_version != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise trust
      - name: Prune Unused Workspaces
        run: mise run prune:unused-workspaces
      - name: Turbo Cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: mise run init
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Extract App Version
        id: version
        run: mise run app:extract-version
      - name: Expo Prebuild
        run: mise run mobile:prebuild android
      - name: Build Android AAB
        run: mise run android:build:aab
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-app-android-prod-${{ needs.create-release.outputs.new_version }}
          path: apps/consumer-app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 5
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: apps/consumer-app/android/app/build/outputs/bundle/release/app-release.aab

  build-ios:
    needs: [create-release]
    if: needs.create-release.outputs.new_version != 'none'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.create-release.outputs.new_version }}
      - name: Turbo Cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise trust
      - run: mise run init
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Extract App Version
        id: version
        run: mise run app:extract-version
      - name: Expo Prebuild
        run: mise run mobile:prebuild ios
      - name: Install Pods
        run: mise run ios:pod-install
      - name: Build iOS IPA
        run: mise run ios:build
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-app-ios-prod-${{ needs.create-release.outputs.new_version }}
          path: apps/consumer-app/ios/build/
          retention-days: 5
      - name: Zip iOS Build
        run: |
          VERSION=${{ needs.create-release.outputs.new_version }}
          mise run pack:ios "ios-build-v${VERSION}.zip"
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: apps/consumer-app/ios/ios-build-*.zip

  deploy-production:
    needs: [create-release, build-push-docker, build-publish-extension, build-spas, build-android, build-ios]
    if: needs.create-release.outputs.new_version != 'none'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Turbo Cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise trust
      - run: mise run init

      - name: Download Admin Panel Artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-panel-prod-v${{ needs.create-release.outputs.new_version }}
          path: apps/admin-panel/dist

      - name: Download Consumer App Artifact
        uses: actions/download-artifact@v4
        with:
          name: consumer-app-prod-v${{ needs.create-release.outputs.new_version }}
          path: apps/consumer-app/dist

      - name: Deploy Admin Panel to Cloudflare Pages
        run: mise run deploy:cloudflare apps/admin-panel/dist styleswipe-admin-panel main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Consumer App to Cloudflare Pages
        run: mise run deploy:cloudflare apps/consumer-app/dist styleswipe-consumer-app main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Convex (Production)
        run: mise run convex:deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
