name: CI/CD Main

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: bun install
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: bun install
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: bun install
      - run: bun run test

  release:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: bun install
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-push-docker:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin-panel, consumer-app, scraper-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Git Config
        uses: docker/login-action@v3
        with:
          registry: git.yomite.in
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (Latest & Version)
        run: |
          VERSION=$(jq -r .version apps/${{ matrix.app }}/package.json)
          echo "Building ${{ matrix.app }} version $VERSION"
          docker buildx build . \
            --file apps/${{ matrix.app }}/Dockerfile \
            --push \
            --tag git.yomite.in/${{ github.repository }}/${{ matrix.app }}:latest \
            --tag git.yomite.in/${{ github.repository }}/${{ matrix.app }}:$VERSION \
            --cache-from type=gha \
            --cache-to type=gha,mode=max

  build-publish-extension:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: bun install
      - name: Build Extension
        working-directory: apps/browser-extension
        run: bun run build
      - name: Get Version
        id: version
        run: echo "VERSION=$(jq -r .version apps/browser-extension/package.json)" >> $GITHUB_OUTPUT
      - name: Zip Extension
        working-directory: apps/browser-extension/dist
        run: zip -r extension-v${{ steps.version.outputs.VERSION }}.zip .
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: apps/browser-extension/dist/extension-v${{ steps.version.outputs.VERSION }}.zip
          tag_name: v${{ steps.version.outputs.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
