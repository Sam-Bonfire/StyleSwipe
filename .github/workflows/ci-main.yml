name: Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag version to release'
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Required CI Secrets for Native Builds:
# - ANDROID_KEYSTORE_BASE64: Base64 encoded release keystore
# - ANDROID_KEYSTORE_PASSWORD: Password for the keystore
# - ANDROID_KEY_ALIAS: Alias for the key
# - ANDROID_KEY_PASSWORD: Password for the key
# - IOS_CERTIFICATE_BASE64: Base64 encoded p12 certificate
# - IOS_CERTIFICATE_PASSWORD: Password for the p12 certificate
# - IOS_PROVISIONING_PROFILE_BASE64: Base64 encoded mobileprovision file

env:
  TURBO_CACHE_DIR: .turbo
  MISE_TRUSTED_CONFIG_PATHS: '/'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.get_version.outputs.version }}
      owner_lower: ${{ steps.get_version.outputs.owner_lower }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Extract version
        id: get_version
        run: |
          REF="${{ inputs.tag_name || github.ref_name }}"
          VERSION=${REF#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lower=$OWNER_LOWER" >> $GITHUB_OUTPUT
          
          # Fetch tags so git describe works
          git fetch --tags --unshallow || git fetch --tags || true
          
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog between $PREV_TAG and HEAD"
            CHANGELOG=$(git log "$PREV_TAG..HEAD" --pretty=format:"* %s (%h)" --no-merges || echo "")
          else
            echo "No previous tag found. Generating full log."
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" --no-merges || echo "")
          fi
          
          # Clean changelog from release/bot-commit messages
          CLEAN_CHANGELOG=$(echo "$CHANGELOG" | grep -v -E "release: v|chore:|bot-commit" || echo "No changes listed.")
          
          # Write changelog to GITHUB_OUTPUT (handling multiline strings)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CLEAN_CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          body: |
            ### 🐳 Docker Container
            ```bash
            docker pull ghcr.io/${{ steps.get_version.outputs.owner_lower }}/scraper-service:${{ steps.get_version.outputs.version }}
            ```

            ### 📝 Changelog
            ${{ steps.get_version.outputs.changelog }}
          generate_release_notes: true
          draft: false
          prerelease: false

  build-push-docker:
    needs: [create-release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [scraper-service]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate env file
        run: |
          echo '${{ toJSON(vars) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env.production

      - name: Build and Push
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG_BASE="ghcr.io/${OWNER_LOWER}/${{ matrix.app }}"
          VERSION=${{ needs.create-release.outputs.new_version }}
          docker build -f apps/${{ matrix.app }}/Dockerfile \
            -t "${TAG_BASE}:latest" \
            -t "${TAG_BASE}:${VERSION}" \
            .
          docker push "${TAG_BASE}:latest"
          docker push "${TAG_BASE}:${VERSION}"

  build-publish-extension:
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: mise trust
      - run: mise run init
      - name: Build Extension
        run: pnpm run build:extension

      - name: Zip Extension
        working-directory: apps/browser-extension/dist
        run: |
          VERSION=${{ needs.create-release.outputs.new_version }}
          zip -r extension-v${VERSION}.zip .
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: apps/browser-extension/dist/extension-*.zip

  build-spas:
    needs: [create-release]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: mise trust
      - run: mise run init

      - name: Generate env file
        run: |
          echo '${{ toJSON(vars) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env.local

      - name: Build SPAs
        run: pnpm run build:spas
        env:
          APP_ENV: production

      - name: Upload Admin Panel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-prod-v${{ needs.create-release.outputs.new_version }}
          path: apps/admin-panel/dist
          retention-days: 5

      - name: Upload Consumer App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-app-prod-v${{ needs.create-release.outputs.new_version }}
          path: apps/consumer-app/dist
          retention-days: 5

  build-android:
    needs: [create-release]
    if: needs.create-release.outputs.new_version != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Prune Unused Workspaces
        run: rm -rf apps/admin-panel apps/browser-extension apps/scraper-service
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: mise trust
      - run: mise run init
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Extract App Version
        id: version
        run: echo "APP_VERSION=$(jq -r .version apps/consumer-app/package.json)" >> $GITHUB_ENV
      - name: Expo Prebuild
        working-directory: apps/consumer-app
        run: pnpm dlx expo prebuild --platform android --clean
      # Placeholder: Inject Keystore and properties here
      # - name: Setup Android Keystore
      #   run: |
      #     echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > apps/consumer-app/android/app/release.keystore
      #     echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> apps/consumer-app/android/gradle.properties
      #     echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> apps/consumer-app/android/gradle.properties
      #     echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> apps/consumer-app/android/gradle.properties
      #     echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> apps/consumer-app/android/gradle.properties
      - name: Build Android AAB
        working-directory: apps/consumer-app/android
        run: ./gradlew bundleRelease
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-app-android-prod-${{ needs.create-release.outputs.new_version }}
          path: apps/consumer-app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 5
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: apps/consumer-app/android/app/build/outputs/bundle/release/app-release.aab

  build-ios:
    needs: [create-release]
    if: needs.create-release.outputs.new_version != 'none'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.create-release.outputs.new_version }}
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: mise trust
      - run: mise run init
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Extract App Version
        id: version
        run: echo "APP_VERSION=$(jq -r .version apps/consumer-app/package.json)" >> $GITHUB_ENV
      - name: Expo Prebuild
        working-directory: apps/consumer-app
        run: pnpm dlx expo prebuild --platform ios --clean
      - name: Install Pods
        working-directory: apps/consumer-app/ios
        run: pod install
      # Placeholder: Inject Certificates and Provisioning Profiles here
      # - name: Setup Provisioning
      #   run: |
      #     # Install cert and profile logic here
      - name: Build iOS IPA
        working-directory: apps/consumer-app/ios
        run: |
          xcodebuild archive \
            -workspace StyleSwipe.xcworkspace \
            -scheme StyleSwipe \
            -configuration Release \
            -archivePath $PWD/build/StyleSwipe.xcarchive \
            CODE_SIGNING_ALLOWED=NO
          # CODE_SIGNING_ALLOWED=NO is set for demonstration purposes, to allow unsigned builds to pass. In reality, you'd setup provisioning and export the IPA.
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-app-ios-prod-${{ needs.create-release.outputs.new_version }}
          path: apps/consumer-app/ios/build/
          retention-days: 5
      - name: Zip iOS Build
        working-directory: apps/consumer-app/ios
        run: |
          VERSION=${{ needs.create-release.outputs.new_version }}
          zip -r ios-build-v${VERSION}.zip build/
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: apps/consumer-app/ios/ios-build-*.zip

  deploy-production:
    needs: [create-release, build-push-docker, build-publish-extension, build-spas, build-android, build-ios]
    if: needs.create-release.outputs.new_version != 'none'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: mise trust
      - run: mise run init

      - name: Download Admin Panel Artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-panel-prod-v${{ needs.create-release.outputs.new_version }}
          path: apps/admin-panel/dist

      - name: Download Consumer App Artifact
        uses: actions/download-artifact@v4
        with:
          name: consumer-app-prod-v${{ needs.create-release.outputs.new_version }}
          path: apps/consumer-app/dist

      - name: Deploy Admin Panel to Cloudflare Pages
        run: pnpm dlx wrangler pages deploy apps/admin-panel/dist --project-name=styleswipe-admin-panel --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Consumer App to Cloudflare Pages
        run: pnpm dlx wrangler pages deploy apps/consumer-app/dist --project-name=styleswipe-consumer-app --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Convex (Production)
        run: pnpm dlx convex deploy
        working-directory: packages/convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
