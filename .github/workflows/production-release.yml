name: Production Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  TURBO_CACHE_DIR: .turbo
  MISE_TRUSTED_CONFIG_PATHS: '/'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false

  build-push-docker:
    needs: [create-release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [scraper-service]
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate env file
        run: |
          echo '${{ toJSON(vars) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env.production

      - name: Build and Push
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG_BASE="ghcr.io/${OWNER_LOWER}/${{ matrix.app }}"
          # Extract version from tag (e.g. v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF_NAME#v}
          docker build -f apps/${{ matrix.app }}/Dockerfile \
            -t "${TAG_BASE}:latest" \
            -t "${TAG_BASE}:${VERSION}" \
            .
          docker push "${TAG_BASE}:latest"
          docker push "${TAG_BASE}:${VERSION}"

  build-publish-extension:
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: mise trust
      - run: bun install
      - name: Build Extension
        working-directory: apps/browser-extension
        run: bun run build

      - name: Zip Extension
        working-directory: apps/browser-extension/dist
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          zip -r extension-v${VERSION}.zip .
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/browser-extension/dist/extension-*.zip

  build-spas:
    needs: [create-release]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: mise trust
      - run: bun install

      - name: Generate env file
        run: |
          echo '${{ toJSON(vars) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env.production

      - name: Build SPAs
        run: bun run --env-file=.env --env-file=.env.production bunx turbo run build --filter @app/admin-panel --filter @app/consumer-app
        env:
          APP_ENV: production

      - name: Upload Admin Panel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-prod-${{ github.ref_name }}
          path: apps/admin-panel/dist
          retention-days: 5

      - name: Upload Consumer App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-app-prod-${{ github.ref_name }}
          path: apps/consumer-app/dist
          retention-days: 5

  build-mobile:
    needs: [create-release]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: mise trust
      - run: bun install
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Build Android AAB (Local)
        run: eas build --platform android --local --non-interactive --profile production --output build/app.aab
        working-directory: apps/consumer-app
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
          APP_VERSION: ${{ github.ref_name }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-app-android-prod-${{ github.ref_name }}
          path: apps/consumer-app/build/app.aab
          retention-days: 5

      - name: Build iOS IPA (Local)
        run: eas build --platform ios --local --non-interactive --profile production --output build/app.ipa
        working-directory: apps/consumer-app
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
          APP_VERSION: ${{ github.ref_name }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-app-ios-prod-${{ github.ref_name }}
          path: apps/consumer-app/build/app.ipa
          retention-days: 5

  deploy-production:
    needs: [create-release, build-push-docker, build-publish-extension, build-spas, build-mobile]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: mise trust
      - run: bun install

      - name: Download Admin Panel Artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-panel-prod-${{ github.ref_name }}
          path: apps/admin-panel/dist

      - name: Download Consumer App Artifact
        uses: actions/download-artifact@v4
        with:
          name: consumer-app-prod-${{ github.ref_name }}
          path: apps/consumer-app/dist

      - name: Deploy Admin Panel to Cloudflare Pages
        run: bunx wrangler pages deploy apps/admin-panel/dist --project-name=styleswipe-admin-panel --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Consumer App to Cloudflare Pages
        run: bunx wrangler pages deploy apps/consumer-app/dist --project-name=styleswipe-consumer-app --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Convex (Production)
        run: bunx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
