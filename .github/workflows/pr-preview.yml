name: PR Validation & Preview

on:
  pull_request:
    branches: ["dev"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_CACHE_DIR: .turbo
  MISE_TRUSTED_CONFIG_PATHS: '/'

jobs:
  validation-and-preview:
    name: Validation, Preview Deploy & E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - uses: jdx/mise-action@v2
        with:
          install: true
      - run: mise run init

      - name: Run Verifications (Lint, Typecheck, Test)
        run: |
          mise run lint
          mise run typecheck
          mise run test

      - name: Sanitize Branch Name
        id: sanitize_branch
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          SANITIZED_NAME=$(echo "$BRANCH_NAME" | tr '/' '-')
          echo "branch_name=$SANITIZED_NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy Convex Preview
        id: convex
        run: mise run deploy:convex:preview ${{ steps.sanitize_branch.outputs.branch_name }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Configure and Seed Convex Environment
        run: |
          mise run convex:env:set ${{ steps.sanitize_branch.outputs.branch_name }} BETTER_AUTH_URL ${{ env.CONVEX_URL }}
          mise run convex:env:set ${{ steps.sanitize_branch.outputs.branch_name }} BETTER_AUTH_SECRET ${{ secrets.BETTER_AUTH_SECRET }}
          mise run convex:seed ${{ steps.sanitize_branch.outputs.branch_name }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Build Web Application
        run: |
          echo "Building consumer app with EXPO_PUBLIC_CONSUMER_APP_CONVEX_URL=${{ env.CONVEX_URL }}"
          cd apps/consumer-app

          echo "EXPO_PUBLIC_CONSUMER_APP_CONVEX_URL=${{ env.CONVEX_URL }}" > .env.local
          SITE_URL=$(echo ${{ env.CONVEX_URL }} | sed 's/\.cloud/\.site/')
          echo "EXPO_PUBLIC_CONSUMER_APP_CONVEX_SITE_URL=$SITE_URL" >> .env.local

          cd ../..
          mise run build:consumer

      - name: Deploy to Cloudflare Pages (Preview)
        id: cloudflare
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: styleswipe-consumer-app
          directory: apps/consumer-app/dist
          branch: ${{ github.head_ref }}

      - name: Configure Convex Trusted Origins
        run: mise run convex:env:set ${{ steps.sanitize_branch.outputs.branch_name }} TRUSTED_ORIGINS ${{ steps.cloudflare.outputs.url }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Install Playwright Browsers
        run: mise run test:e2e:install

      - name: Run Playwright E2E Tests
        run: mise run test:e2e
        env:
          PREVIEW_URL: ${{ steps.cloudflare.outputs.url }}
