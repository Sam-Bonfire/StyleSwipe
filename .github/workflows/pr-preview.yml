name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  preview:
    name: Preview Deploy & E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools (Mise)
        uses: jdx/mise-action@v2
        with:
          install: true # Ensures tools in .mise.toml (like bun) are installed

      - name: Install Dependencies
        run: bun install

      - name: Deploy Convex Preview
        id: convex
        run: |
          cd packages/convex
          # Convex deploy automatically targets a preview if CONVEX_DEPLOY_KEY is a preview key
          # If CONVEX_DEPLOY_KEY is set to a preview key, a preview deployment is automatically created.
          # By using --cmd, Convex will automatically expose the generated URL inside the command
          # We can use that command to export the URL to GITHUB_ENV so subsequent steps can use it.
          # Also run the seed script locally pointing to the new preview.
          #
          # NOTE: bunx is not available globally without installation, so we use `bun run convex`.

          bun run convex deploy \
            --cmd-url-env-var-name "CONVEX_URL" \
            --cmd 'echo "CONVEX_URL=$CONVEX_URL" >> $GITHUB_ENV && CONVEX_URL=$CONVEX_URL bun run convex run seed:run'

        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Configure Convex Environment
        run: |
          cd packages/convex
          # Set the BETTER_AUTH_URL dynamically to match the exact preview URL deployed above
          bun run convex env set BETTER_AUTH_URL ${{ env.CONVEX_URL }}
          bun run convex env set BETTER_AUTH_SECRET ${{ secrets.BETTER_AUTH_SECRET }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Build Web Application
        # We build the consumer app since the layout modification was there
        run: |
          echo "Building consumer app with EXPO_PUBLIC_CONSUMER_APP_CONVEX_URL=${{ env.CONVEX_URL }}"
          cd apps/consumer-app
          bun run build
        env:
          EXPO_PUBLIC_CONSUMER_APP_CONVEX_URL: ${{ env.CONVEX_URL }}

      - name: Deploy to Cloudflare Pages (Preview)
        id: cloudflare
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: styleswipe-consumer-app
          directory: apps/consumer-app/dist
          # Deploying to a branch automatically creates a preview deployment in Cloudflare
          branch: ${{ github.head_ref }}

      - name: Run Playwright E2E Tests
        run: bunx playwright test
        env:
          # Point the Playwright tests to the Cloudflare preview URL generated above
          PREVIEW_URL: ${{ steps.cloudflare.outputs.url }}
