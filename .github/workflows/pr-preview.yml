name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  preview:
    name: Preview Deploy & E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools (Mise)
        uses: jdx/mise-action@v2
        with:
          install: true # Ensures tools in .mise.toml (like bun) are installed

      - name: Install Dependencies
        run: bun install

      - name: Deploy Convex Preview
        id: convex
        run: |
          cd packages/convex
          # Note: If CONVEX_DEPLOY_KEY is NOT a preview deploy key (e.g. prod deploy key),
          # the `--preview-create` flag will cause convex to exit with code 1.
          # If it is a preview deploy key, this creates an ephemeral preview deployment matching the PR branch.
          #
          # We use `--cmd` to run a shell command that pulls the deployment URL and injects it into GITHUB_ENV.
          # `echo "$CONVEX_URL" >> $GITHUB_ENV` failed on the previous run likely because of escaping. Let's write it to a .env file.
          bun run convex deploy \
            --preview-create "${{ github.head_ref }}" \
            --cmd-url-env-var-name "CONVEX_URL" \
            --cmd 'echo "CONVEX_URL=$CONVEX_URL" >> "$GITHUB_ENV"'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Configure and Seed Convex Environment
        run: |
          cd packages/convex
          # Note: If CONVEX_DEPLOY_KEY is a preview key, `convex env set` will automatically target the preview.
          # We cannot use `--url` on `env set` because it's not a valid flag.
          bun run convex env set BETTER_AUTH_URL ${{ env.CONVEX_URL }}
          bun run convex env set BETTER_AUTH_SECRET ${{ secrets.BETTER_AUTH_SECRET }}

          # Run the seed script
          bun run convex run seed:run
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Build Web Application
        # We build the consumer app since the layout modification was there
        run: |
          echo "Building consumer app with EXPO_PUBLIC_CONSUMER_APP_CONVEX_URL=${{ env.CONVEX_URL }}"
          cd apps/consumer-app
          # Set directly into environment before running build to guarantee it is picked up
          # without relying solely on .env.local
          EXPO_PUBLIC_CONSUMER_APP_CONVEX_URL="${{ env.CONVEX_URL }}" bun run build

      - name: Deploy to Cloudflare Pages (Preview)
        id: cloudflare
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: styleswipe-consumer-app
          directory: apps/consumer-app/dist
          # Deploying to a branch automatically creates a preview deployment in Cloudflare
          branch: ${{ github.head_ref }}

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: bunx playwright test
        env:
          # Point the Playwright tests to the Cloudflare preview URL generated above
          PREVIEW_URL: ${{ steps.cloudflare.outputs.url }}
