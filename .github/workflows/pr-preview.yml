name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  preview:
    name: Preview Deploy & E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools (Mise)
        uses: jdx/mise-action@v2
        with:
          install: true # Ensures tools in .mise.toml (like bun) are installed

      - name: Install Dependencies
        run: bun install

      - name: Sanitize Branch Name
        id: sanitize_branch
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          SANITIZED_NAME=$(echo "$BRANCH_NAME" | tr '/' '-')
          echo "branch_name=$SANITIZED_NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy Convex Preview
        id: convex
        run: |
          cd packages/convex
          # Note: If CONVEX_DEPLOY_KEY is NOT a preview deploy key (e.g. prod deploy key),
          # the `--preview-create` flag will cause convex to exit with code 1.
          # If it is a preview deploy key, this creates an ephemeral preview deployment matching the PR branch.
          #
          # We use `npx` (which works reliably across CI environments) to execute `convex deploy`.
          # We use `--cmd` to securely append the URL to GITHUB_ENV without relying on parsing stdout.
          npx convex deploy \
            --preview-create "${{ steps.sanitize_branch.outputs.branch_name }}" \
            --cmd-url-env-var-name "CONVEX_URL" \
            --cmd 'echo "CONVEX_URL=$CONVEX_URL" >> "$GITHUB_ENV"'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Configure and Seed Convex Environment
        run: |
          cd packages/convex

          # Note: If CONVEX_DEPLOY_KEY is a preview key, `convex env set` will automatically target the preview.
          # We cannot use `--url` on `env set` because it's not a valid flag.
          npx convex env set BETTER_AUTH_URL --deployment preview/${{ steps.sanitize_branch.outputs.branch_name }} ${{ env.CONVEX_URL }}
          npx convex env set BETTER_AUTH_SECRET --deployment preview/${{ steps.sanitize_branch.outputs.branch_name }} ${{ secrets.BETTER_AUTH_SECRET }}

          # Run the seed script
          npx convex run seed:run --deployment preview/${{ steps.sanitize_branch.outputs.branch_name }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Build Web Application
        # We build the consumer app since the layout modification was there
        run: |
          echo "Building consumer app with EXPO_PUBLIC_CONSUMER_APP_CONVEX_URL=${{ env.CONVEX_URL }}"
          cd apps/consumer-app

          # Write it securely to .env.local
          echo "EXPO_PUBLIC_CONSUMER_APP_CONVEX_URL=${{ env.CONVEX_URL }}" > .env.local
          # Provide SITE_URL as well, better-auth needs it to match endpoints
          SITE_URL=$(echo ${{ env.CONVEX_URL }} | sed 's/\.cloud/\.site/')
          echo "EXPO_PUBLIC_CONSUMER_APP_CONVEX_SITE_URL=$SITE_URL" >> .env.local

          bun run build

      - name: Deploy to Cloudflare Pages (Preview)
        id: cloudflare
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: styleswipe-consumer-app
          directory: apps/consumer-app/dist
          # Deploying to a branch automatically creates a preview deployment in Cloudflare
          branch: ${{ github.head_ref }}

      - name: Configure Convex Trusted Origins
        run: |
          cd packages/convex
          npx convex env set TRUSTED_ORIGINS --deployment preview/${{ steps.sanitize_branch.outputs.branch_name }} ${{ steps.cloudflare.outputs.url }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: bunx playwright test
        env:
          # Point the Playwright tests to the Cloudflare preview URL generated above
          PREVIEW_URL: ${{ steps.cloudflare.outputs.url }}
