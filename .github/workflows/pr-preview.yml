name: PR Validation & Preview

on:
  pull_request:
    branches: ["dev"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_CACHE_DIR: .turbo
  MISE_TRUSTED_CONFIG_PATHS: '/'

jobs:
  validation-and-preview:
    name: Validation, Preview Deploy & E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Turbo Cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Setup Mise
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Trust Mise
        run: mise trust

      - name: Install Dependencies
        run: mise run init

      - name: Run Verifications (Lint, Typecheck, Test)
        run: |
          mise run lint
          mise run typecheck
          mise run test

      - name: Sanitize Branch Name
        id: sanitize_branch
        run: mise run branch:sanitize "${{ github.head_ref }}"

      - name: Deploy Convex Preview
        id: convex
        run: mise run convex:deploy-preview "${{ steps.sanitize_branch.outputs.branch_name }}"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Configure and Seed Convex Environment
        run: mise run convex:setup-preview "${{ steps.sanitize_branch.outputs.branch_name }}"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      - name: Build Web Application
        run: |
          mise run env:preview "${{ env.CONVEX_URL }}"
          mise run build:consumer

      - name: Deploy to Cloudflare Pages (Preview)
        id: cloudflare
        run: mise run deploy:cloudflare apps/consumer-app/dist styleswipe-consumer-app "${{ steps.sanitize_branch.outputs.branch_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Convex Trusted Origins
        run: mise run convex:set-trusted-origins "${{ steps.sanitize_branch.outputs.branch_name }}" "https://${{ steps.sanitize_branch.outputs.branch_name }}.styleswipe-consumer-app.pages.dev"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Install Playwright Browsers
        run: mise run test:e2e:install

      - name: Run Playwright E2E Tests
        run: mise run test:e2e
        env:
          PREVIEW_URL: "https://${{ steps.sanitize_branch.outputs.branch_name }}.styleswipe-consumer-app.pages.dev"
