[tools]
pnpm = "9.12.3"
node = "lts"
"npm:@withgraphite/graphite-cli" = "latest"

[tasks.killports]
description = "Kill any orphaned processes running on local dev ports (8081, 8082, 3001)"
run = "npx tsx bin/kill-ports.ts"

[tasks.dev]
description = "Start all development services (Convex, Consumer, Admin, Scraper)"
depends = ["dev:convex", "dev:consumer:run", "dev:admin:run", "dev:scraper:run"]

[tasks."dev:convex"]
description = "Start Convex backend development server"
run = "pnpm dlx turbo run dev --filter @app/convex"

[tasks."dev:consumer"]
description = "Start Consumer Mobile/Web App (with Convex)"
depends = ["dev:convex", "dev:consumer:run"]

[tasks."dev:consumer:run"]
hide = true
run = "pnpm run --env-file=.env --env-file=.env.local --filter @app/consumer-app dev"

[tasks."dev:consumer:web"]
description = "Start Consumer App for Web (with Convex)"
depends = ["dev:convex", "dev:consumer:web:run"]

[tasks."dev:consumer:web:run"]
hide = true
run = "pnpm run --env-file=.env --env-file=.env.local --filter @app/consumer-app web"

[tasks."dev:admin"]
description = "Start Admin Panel (with Convex)"
depends = ["dev:convex", "dev:admin:run"]

[tasks."dev:admin:run"]
hide = true
run = "pnpm run --env-file=.env --env-file=.env.local --filter @app/admin-panel dev"

[tasks."dev:scraper"]
description = "Start Scraper Service (with Convex)"
depends = ["dev:convex", "dev:scraper:run"]

[tasks."dev:scraper:run"]
hide = true
run = "pnpm run --env-file=.env --env-file=.env.local --filter @app/scraper-service start -- --daemon"

[tasks.typecheck]
description = "Run TypeScript type checking across the entire monorepo"
run = "pnpm dlx turbo run typecheck"

[tasks.lint]
description = "Run ESLint across the entire monorepo"
run = "pnpm dlx turbo run lint"

[tasks.test]
description = "Run all tests"
run = "pnpm dlx turbo run test"

[tasks.submit]
description = "Submit current stack to GitHub using Graphite"
run = "npx tsx bin/submit.ts"

[tasks.release]
description = "Run release process"
run = "npx tsx bin/release.ts"

[tasks.sync]
description = "Sync Graphite stack"
run = "gt stack get"

[tasks."lint:fix"]
description = "Automatically fix linting errors"
run = "eslint --fix ."

[tasks."format:fix"]
description = "Automatically format code with Prettier"
run = "prettier --write ."

[tasks."build:extension"]
description = "Build the Browser Extension"
run = "pnpm run --env-file=.env --env-file=.env.local --filter @app/browser-extension build"

[tasks."build:spas"]
description = "Build all SPAs (Admin and Consumer) with target environment variables loaded"
run = "pnpm run --env-file=.env --env-file=.env.local pnpm dlx turbo run build --filter @app/admin-panel --filter @app/consumer-app"

[tasks."typecheck:ui"]
description = "Typecheck only the UI Kit"
run = "pnpm run --filter @app/ui-kit typecheck"

[tasks.scraper]
description = "Start Scraper Service (foreground)"
run = "pnpm run --env-file=.env.local --filter @app/scraper-service start --"

[tasks."verify:scraper"]
description = "Typecheck only the Scraper Service"
run = "pnpm run --filter @app/scraper-service typecheck"

[tasks.task]
description = "Start a new development task"
usage = """
arg "<type>" help="Task type (feat, fix, refactor, chore)"
arg "<title>..." help="Brief title of the task"
"""
run = 'npx tsx bin/task-start.ts "$usage_type" "$usage_title"'

[tasks.snap]
description = "Create a project snapshot"
usage = """
arg "<type>" help="Commit type (feat, fix, etc.)"
arg "<title>..." help="Brief title"
flag "-d --description <text>" help="Optional detailed description"
flag "-t --ticket <id>" help="Optional ticket ID"
"""
run = 'npx tsx bin/snapshot.ts "$usage_type" "$usage_title" "$usage_description" "$usage_ticket"'

[tasks.clean]
description = "Cleanup all node_modules, .turbo, and build artifacts"
run = "npx tsx bin/clean.ts"

[tasks.init]
description = "Install dependencies using pnpm"
run = "mise install && corepack enable pnpm && pnpm install"

[tasks."expo:prebuild:android"]
description = "Expo prebuild for Android"
run = "cd apps/consumer-app && npx expo prebuild --platform android --clean"

[tasks."expo:prebuild:ios"]
description = "Expo prebuild for iOS"
run = "cd apps/consumer-app && npx expo prebuild --platform ios --clean"

[tasks."build:android:apk"]
description = "Build Android APK"
run = "cd apps/consumer-app/android && ./gradlew assembleRelease"

[tasks."build:android:aab"]
description = "Build Android AAB"
run = "cd apps/consumer-app/android && ./gradlew bundleRelease"

[tasks."ios:pod-install"]
description = "Install iOS pods"
run = "cd apps/consumer-app/ios && pod install"

[tasks."build:ios:archive"]
description = "Build iOS Archive"
run = "cd apps/consumer-app/ios && xcodebuild archive -workspace StyleSwipe.xcworkspace -scheme StyleSwipe -configuration Release -archivePath $PWD/build/StyleSwipe.xcarchive CODE_SIGNING_ALLOWED=NO"

[tasks."deploy:pages:admin"]
description = "Deploy Admin Panel to Cloudflare Pages"
usage = """
arg "<branch>" help="Branch to deploy to"
"""
run = "npx wrangler pages deploy apps/admin-panel/dist --project-name=styleswipe-admin-panel --branch=$usage_branch"

[tasks."deploy:pages:consumer"]
description = "Deploy Consumer App to Cloudflare Pages"
usage = """
arg "<branch>" help="Branch to deploy to"
"""
run = "npx wrangler pages deploy apps/consumer-app/dist --project-name=styleswipe-consumer-app --branch=$usage_branch"

[tasks."deploy:convex"]
description = "Deploy Convex"
run = "cd packages/convex && npx convex deploy"

[tasks."deploy:convex:preview"]
description = "Deploy Convex Preview"
usage = """
arg "<branch>" help="Branch to create preview for"
"""
run = "cd packages/convex && npx convex deploy --preview-create $usage_branch --cmd-url-env-var-name CONVEX_URL --cmd 'echo \"CONVEX_URL=$CONVEX_URL\" >> \"$GITHUB_ENV\"'"

[tasks."convex:env:set"]
description = "Set Convex Environment Variable"
usage = """
arg "<branch>" help="Branch to set env var for"
arg "<key>" help="Env var key"
arg "<value>" help="Env var value"
"""
run = "cd packages/convex && npx convex env set $usage_key --deployment preview/$usage_branch $usage_value"

[tasks."convex:seed"]
description = "Seed Convex Preview"
usage = """
arg "<branch>" help="Branch to seed"
"""
run = "cd packages/convex && npx convex run seed:run --deployment preview/$usage_branch"

[tasks."test:e2e:install"]
description = "Install Playwright dependencies"
run = "npx playwright install --with-deps chromium"

[tasks."test:e2e"]
description = "Run E2E tests"
run = "npx playwright test"

[tasks."build:consumer"]
description = "Build consumer app"
run = "cd apps/consumer-app && pnpm run build"
