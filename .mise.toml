[tools]
pnpm = "9.12.3"
node = "lts"
"npm:@withgraphite/graphite-cli" = "latest"

[tasks.killports]
description = "Kill any orphaned processes running on local dev ports (8081, 8082, 3001)"
run = "npx tsx bin/kill-ports.ts"

[tasks.dev]
description = "Start all development services (Convex, Consumer, Admin, Scraper)"
depends = ["dev:convex", "dev:consumer:run", "dev:admin:run", "dev:scraper:run"]

[tasks."dev:convex"]
description = "Start Convex backend development server"
run = "pnpm dlx turbo run dev --filter @app/convex"

[tasks."dev:consumer"]
description = "Start Consumer Mobile/Web App (with Convex)"
depends = ["dev:convex", "dev:consumer:run"]

[tasks."dev:consumer:run"]
hide = true
run = "npx dotenv -e .env -e .env.local -o -- pnpm run --filter @app/consumer-app dev"

[tasks."dev:consumer:web"]
description = "Start Consumer App for Web (with Convex)"
depends = ["dev:convex", "dev:consumer:web:run"]

[tasks."dev:consumer:web:run"]
hide = true
run = "npx dotenv -e .env -e .env.local -o -- pnpm run --filter @app/consumer-app web"

[tasks."dev:admin"]
description = "Start Admin Panel (with Convex)"
depends = ["dev:convex", "dev:admin:run"]

[tasks."dev:admin:run"]
hide = true
run = "npx dotenv -e .env -e .env.local -o -- pnpm run --filter @app/admin-panel dev"

[tasks."dev:scraper"]
description = "Start Scraper Service (with Convex)"
depends = ["dev:convex", "dev:scraper:run"]

[tasks."dev:scraper:run"]
hide = true
run = "npx dotenv -e .env -e .env.local -o -- pnpm run --filter @app/scraper-service start -- --daemon"

[tasks.typecheck]
description = "Run TypeScript type checking across the entire monorepo"
run = "pnpm dlx turbo run typecheck"

[tasks.lint]
description = "Run ESLint across the entire monorepo"
run = "pnpm dlx turbo run lint"

[tasks.test]
description = "Run all tests"
run = "pnpm dlx turbo run test"

[tasks.submit]
description = "Submit current stack to GitHub using Graphite"
run = "npx tsx bin/submit.ts"

[tasks.release]
description = "Run release process"
run = "npx tsx bin/release.ts"

[tasks.sync]
description = "Sync Graphite stack"
run = "gt stack get"

[tasks."lint:fix"]
description = "Automatically fix linting errors"
run = "eslint --fix ."

[tasks."format:fix"]
description = "Automatically format code with Prettier"
run = "prettier --write ."

[tasks."build:extension"]
description = "Build the Browser Extension"
run = "npx dotenv -e .env -e .env.local -o -- pnpm run --filter @app/browser-extension build"

[tasks."build:spas"]
description = "Build all SPAs (Admin and Consumer) with target environment variables loaded"
run = "npx dotenv -e .env -e .env.local -o -- pnpm dlx turbo run build --filter @app/admin-panel --filter @app/consumer-app"

[tasks."build:consumer"]
description = "Build the Consumer App for Web"
run = "npx dotenv -e .env -e .env.local -o -- pnpm run --filter @app/consumer-app build"

[tasks."build:admin"]
description = "Build the Admin Panel for Web"
run = "npx dotenv -e .env -e .env.local -o -- pnpm run --filter @app/admin-panel build"

[tasks."pack:extension"]
description = "Zip browser extension build directory"
usage = """
arg "<output_file>" help="Output zip filename"
"""
run = 'cd apps/browser-extension/dist && zip -r "$usage_output_file" .'

[tasks."pack:ios"]
description = "Zip iOS build directory"
usage = """
arg "<output_file>" help="Output zip filename"
"""
run = 'cd apps/consumer-app/ios && zip -r "$usage_output_file" build/'

[tasks."env:generate"]
description = "Generate environment file from JSON string of variables"
usage = """
arg "<json_vars>" help="JSON string of variables"
arg "<output_file>" help="Output environment file path"
"""
run = 'echo "$usage_json_vars" | jq -r "to_entries[] | \"\\(.key)=\\(.value)\"" > "$usage_output_file"'

[tasks."env:preview"]
description = "Generate .env.local for preview build"
usage = """
arg "<convex_url>" help="Convex deployment URL"
"""
run = """
SITE_URL=$(echo "$usage_convex_url" | sed 's/\\.cloud/\\.site/')
echo "EXPO_PUBLIC_CONSUMER_APP_CONVEX_URL=$usage_convex_url" > .env.local
echo "EXPO_PUBLIC_CONSUMER_APP_CONVEX_SITE_URL=$SITE_URL" >> .env.local
cp .env.local apps/consumer-app/.env.local 2>/dev/null || true
cp .env.local apps/admin-panel/.env.local 2>/dev/null || true
"""

[tasks."branch:sanitize"]
description = "Sanitize branch name for deployment"
usage = """
arg "<branch>" help="Branch name"
"""
run = 'echo "branch_name=$(echo "$usage_branch" | tr "/" "-")" >> "$GITHUB_OUTPUT"'

[tasks."docker:build"]
description = "Build Docker image"
usage = """
arg "<app>" help="App name"
arg "<tags>..." help="Space-separated list of image tags"
"""
run = """
TAG_ARGS=""
for tag in $usage_tags; do
  TAG_ARGS="$TAG_ARGS -t $tag"
done
docker build -f apps/"$usage_app"/Dockerfile $TAG_ARGS .
"""

[tasks."docker:push"]
description = "Push Docker images"
usage = """
arg "<tags>..." help="Space-separated list of image tags"
"""
run = """
for tag in $usage_tags; do
  docker push "$tag"
done
"""

[tasks."convex:deploy"]
description = "Deploy Convex functions"
run = "cd packages/convex && npx convex deploy"

[tasks."convex:deploy-preview"]
description = "Deploy Convex preview environment"
usage = """
arg "<branch_name>" help="Branch name for preview"
"""
run = """
cd packages/convex
npx convex deploy \
  --preview-create "$usage_branch_name" \
  --cmd-url-env-var-name "CONVEX_URL" \
  --cmd 'echo "CONVEX_URL=$CONVEX_URL" >> "$GITHUB_ENV"'
"""

[tasks."convex:setup-preview"]
description = "Configure and seed Convex preview environment"
usage = """
arg "<branch_name>" help="Branch name for preview"
"""
run = """
cd packages/convex
npx convex env set BETTER_AUTH_URL --deployment preview/"$usage_branch_name" "$CONVEX_URL"
npx convex env set BETTER_AUTH_SECRET --deployment preview/"$usage_branch_name" "$BETTER_AUTH_SECRET"
npx convex run seed:run --deployment preview/"$usage_branch_name"
"""

[tasks."convex:set-trusted-origins"]
description = "Set trusted origins for Convex preview environment"
usage = """
arg "<branch_name>" help="Branch name for preview"
arg "<origin>" help="Origin URL"
"""
run = 'cd packages/convex && npx convex env set TRUSTED_ORIGINS --deployment preview/"$usage_branch_name" "$usage_origin"'

[tasks."mobile:prebuild"]
description = "Run Expo prebuild for consumer app"
usage = """
arg "<platform>" help="android or ios"
"""
run = 'cd apps/consumer-app && npx expo prebuild --platform "$usage_platform" --clean'

[tasks."android:build:apk"]
description = "Build Android release APK"
run = "cd apps/consumer-app/android && ./gradlew assembleRelease"

[tasks."android:build:aab"]
description = "Build Android release AAB bundle"
run = "cd apps/consumer-app/android && ./gradlew bundleRelease"

[tasks."ios:pod-install"]
description = "Install CocoaPods for iOS"
run = "cd apps/consumer-app/ios && pod install"

[tasks."ios:build"]
description = "Build iOS release archive"
run = """
cd apps/consumer-app/ios && xcodebuild archive \
  -workspace StyleSwipe.xcworkspace \
  -scheme StyleSwipe \
  -configuration Release \
  -archivePath $PWD/build/StyleSwipe.xcarchive \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks."deploy:cloudflare"]
description = "Deploy app dist directory to Cloudflare Pages"
usage = """
arg "<dist_dir>" help="Path to dist directory"
arg "<project_name>" help="Cloudflare project name"
arg "<branch>" help="Branch name"
"""
run = 'npx wrangler pages deploy "$usage_dist_dir" --project-name="$usage_project_name" --branch="$usage_branch"'

[tasks."test:e2e:install"]
description = "Install Playwright browsers with dependencies"
run = "npx playwright install --with-deps chromium"

[tasks."test:e2e"]
description = "Run Playwright E2E tests"
run = "npx playwright test"

[tasks."git:promote-dev"]
description = "Fast-forward merge dev into main and push"
run = """
git config --global user.name "github-actions[bot]"
git config --global user.email "github-actions[bot]@users.noreply.github.com"
git checkout main
git merge --ff-only origin/dev
git push origin main
"""

[tasks."version:bump"]
description = "Bump patch version across package.json files and create git tag"
run = """
git config user.name "github-actions[bot]"
git config user.email "github-actions[bot]@users.noreply.github.com"

VERSION=$(jq -r .version package.json)
echo "Current version: $VERSION"

IFS='.' read -r -a parts <<< "$VERSION"
parts[2]=$((parts[2] + 1))
NEW_VERSION="${parts[0]}.${parts[1]}.${parts[2]}"
echo "New version: $NEW_VERSION"

jq --arg ver "$NEW_VERSION" '.version = $ver' package.json > package.json.tmp && mv package.json.tmp package.json

for pkg in apps/*/package.json packages/*/package.json; do
  if [ -f "$pkg" ]; then
    jq --arg ver "$NEW_VERSION" '.version = $ver' "$pkg" > "${pkg}.tmp" && mv "${pkg}.tmp" "$pkg"
  fi
done

git add package.json apps/*/package.json packages/*/package.json
git commit -m "release: v$NEW_VERSION"

TAG="v$NEW_VERSION"
git tag $TAG
git push origin main
git push origin $TAG

echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
"""

[tasks."release:extract-info"]
description = "Extract version, owner_lower, and changelog for production release"
usage = """
arg "<ref>" help="Git ref or tag name"
arg "<repo_owner>" help="GitHub repository owner"
"""
run = """
REF="$usage_ref"
VERSION=${REF#v}
echo "version=$VERSION" >> "$GITHUB_OUTPUT"

OWNER_LOWER=$(echo "$usage_repo_owner" | tr '[:upper:]' '[:lower:]')
echo "owner_lower=$OWNER_LOWER" >> "$GITHUB_OUTPUT"

git fetch --tags --unshallow || git fetch --tags || true

PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
if [ -n "$PREV_TAG" ]; then
  echo "Generating changelog between $PREV_TAG and HEAD"
  CHANGELOG=$(git log "$PREV_TAG..HEAD" --pretty=format:"* %s (%h)" --no-merges || echo "")
else
  echo "No previous tag found. Generating full log."
  CHANGELOG=$(git log --pretty=format:"* %s (%h)" --no-merges || echo "")
fi

CLEAN_CHANGELOG=$(echo "$CHANGELOG" | grep -v -E "release: v|chore:|bot-commit" || echo "No changes listed.")

echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
echo "$CLEAN_CHANGELOG" >> "$GITHUB_OUTPUT"
echo "EOF" >> "$GITHUB_OUTPUT"
"""

[tasks."app:extract-version"]
description = "Extract app version to GITHUB_ENV"
run = 'echo "APP_VERSION=$(jq -r .version apps/consumer-app/package.json)" >> "$GITHUB_ENV"'

[tasks."prune:unused-workspaces"]
description = "Prune non-mobile workspaces to save disk space"
run = "rm -rf apps/admin-panel apps/browser-extension apps/scraper-service"

[tasks."typecheck:ui"]
description = "Typecheck only the UI Kit"
run = "pnpm run --filter @app/ui-kit typecheck"

[tasks.scraper]
description = "Start Scraper Service (foreground)"
run = "npx dotenv -e .env -e .env.local -o -- pnpm run --filter @app/scraper-service start --"

[tasks."verify:scraper"]
description = "Typecheck only the Scraper Service"
run = "pnpm run --filter @app/scraper-service typecheck"

[tasks.task]
description = "Start a new development task"
usage = """
arg "<type>" help="Task type (feat, fix, refactor, chore)"
arg "<title>..." help="Brief title of the task"
"""
run = 'npx tsx bin/task-start.ts "$usage_type" "$usage_title"'

[tasks.snap]
description = "Create a project snapshot"
usage = """
arg "<type>" help="Commit type (feat, fix, etc.)"
arg "<title>..." help="Brief title"
flag "-d --description <text>" help="Optional detailed description"
flag "-t --ticket <id>" help="Optional ticket ID"
"""
run = 'npx tsx bin/snapshot.ts "$usage_type" "$usage_title" "$usage_description" "$usage_ticket"'

[tasks.clean]
description = "Cleanup all node_modules, .turbo, and build artifacts"
run = "npx tsx bin/clean.ts"

[tasks.init]
description = "Install dependencies using pnpm"
run = "mise install && corepack enable pnpm && pnpm install"
