[tools]
node = "lts"
"npm:@withgraphite/graphite-cli" = "latest"
pnpm = "9.0.0"


[tasks.killports]
description = "Kill any orphaned processes running on local dev ports (8081, 8082, 3001)"
run = "pnpm dlx tsx bin/kill-ports.ts"

[tasks.dev]
description = "Start all development services (Convex, Consumer, Admin, Scraper)"
depends = ["dev:convex", "dev:consumer:run", "dev:admin:run", "dev:scraper:run"]

[tasks."dev:convex"]
description = "Start Convex backend development server"
run = "pnpm exec turbo run dev --filter @app/convex"

[tasks."dev:consumer"]
description = "Start Consumer Mobile/Web App (with Convex)"
depends = ["dev:convex", "dev:consumer:run"]

[tasks."dev:consumer:run"]
hide = true
run = "pnpm run --env-file=.env --env-file=.env.local --filter @app/consumer-app dev"

[tasks."dev:consumer:web"]
description = "Start Consumer App for Web (with Convex)"
depends = ["dev:convex", "dev:consumer:web:run"]

[tasks."dev:consumer:web:run"]
hide = true
run = "pnpm run --env-file=.env --env-file=.env.local --filter @app/consumer-app web"

[tasks."dev:admin"]
description = "Start Admin Panel (with Convex)"
depends = ["dev:convex", "dev:admin:run"]

[tasks."dev:admin:run"]
hide = true
run = "pnpm run --env-file=.env --env-file=.env.local --filter @app/admin-panel dev"

[tasks."dev:scraper"]
description = "Start Scraper Service (with Convex)"
depends = ["dev:convex", "dev:scraper:run"]

[tasks."dev:scraper:run"]
hide = true
run = "pnpm run --env-file=.env --env-file=.env.local --filter @app/scraper-service start -- --daemon"

[tasks.typecheck]
description = "Run TypeScript type checking across the entire monorepo"
run = "pnpm exec turbo run typecheck"

[tasks.lint]
description = "Run ESLint across the entire monorepo"
run = "pnpm exec turbo run lint"

[tasks.test]
description = "Run all tests"
run = "pnpm exec turbo run test"

[tasks.submit]
description = "Submit current stack to GitHub using Graphite"
run = "pnpm dlx tsx bin/submit.ts"

[tasks.release]
description = "Run release process"
run = "pnpm dlx tsx bin/release.ts"

[tasks.sync]
description = "Sync Graphite stack"
run = "gt stack get"

[tasks."lint:fix"]
description = "Automatically fix linting errors"
run = "eslint --fix ."

[tasks."format:fix"]
description = "Automatically format code with Prettier"
run = "prettier --write ."

[tasks."build:extension"]
description = "Build the Browser Extension"
run = "pnpm run --env-file=.env --env-file=.env.local --filter @app/browser-extension build"

[tasks."build:spas"]
description = "Build all SPAs (Admin and Consumer) with target environment variables loaded"
run = "pnpm run --env-file=.env --env-file=.env.local pnpm exec turbo run build --filter @app/admin-panel --filter @app/consumer-app"

[tasks."typecheck:ui"]
description = "Typecheck only the UI Kit"
run = "pnpm run --filter @app/ui-kit typecheck"

[tasks.scraper]
description = "Start Scraper Service (foreground)"
run = "pnpm run --env-file=.env.local --filter @app/scraper-service start --"

[tasks."verify:scraper"]
description = "Typecheck only the Scraper Service"
run = "pnpm run --filter @app/scraper-service typecheck"

[tasks.task]
description = "Start a new development task"
usage = """
arg "<type>" help="Task type (feat, fix, refactor, chore)"
arg "<title>..." help="Brief title of the task"
"""
run = 'pnpm dlx tsx bin/task-start.ts "$usage_type" "$usage_title"'

[tasks.snap]
description = "Create a project snapshot"
usage = """
arg "<type>" help="Commit type (feat, fix, etc.)"
arg "<title>..." help="Brief title"
flag "-d --description <text>" help="Optional detailed description"
flag "-t --ticket <id>" help="Optional ticket ID"
"""
run = 'pnpm dlx tsx bin/snapshot.ts "$usage_type" "$usage_title" "$usage_description" "$usage_ticket"'

[tasks.clean]
description = "Cleanup all node_modules, .turbo, and build artifacts"
run = "pnpm dlx tsx bin/clean.ts"

[tasks.init]
description = "Initialize the project, trust mise configuration, install tools and dependencies"
run = [
  "mise trust",
  "mise install",
  "pnpm install --no-frozen-lockfile"
]

[tasks."deploy:admin-panel"]
description = "Deploy Admin Panel to Cloudflare Pages"
usage = """
arg "<branch>" help="Branch to deploy to (staging, main)"
"""
run = 'pnpm dlx wrangler pages deploy apps/admin-panel/dist --project-name=styleswipe-admin-panel --branch="$usage_branch"'

[tasks."deploy:consumer-app"]
description = "Deploy Consumer App to Cloudflare Pages"
usage = """
arg "<branch>" help="Branch to deploy to (staging, main)"
"""
run = 'pnpm dlx wrangler pages deploy apps/consumer-app/dist --project-name=styleswipe-consumer-app --branch="$usage_branch"'

[tasks."deploy:convex"]
description = "Deploy Convex"
run = "pnpm dlx convex deploy"

[tasks."e2e:install"]
description = "Install Playwright Browsers"
run = "pnpm dlx playwright install --with-deps chromium"

[tasks.e2e]
description = "Run Playwright E2E Tests"
run = "pnpm dlx playwright test"

[tasks."prebuild:android"]
description = "Expo prebuild for Android"
dir = "apps/consumer-app"
run = "pnpm dlx expo prebuild --platform android --clean"

[tasks."prebuild:ios"]
description = "Expo prebuild for iOS"
dir = "apps/consumer-app"
run = "pnpm dlx expo prebuild --platform ios --clean"

[tasks."build:consumer"]
description = "Build Consumer App"
run = "pnpm run --filter @app/consumer-app build"
